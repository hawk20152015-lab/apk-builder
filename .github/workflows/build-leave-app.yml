name: Build Leave App APK
run-name: "APK ← leave-app (${{ github.sha }})"

on:
  push:
    branches: [ leave-app ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache automake
          pip install --upgrade pip
          pip install buildozer==1.5.0 "cython==0.29.36"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-leave-app-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build APK
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log
          test -n "$(ls bin/*.apk 2>/dev/null)" || { echo "::error::Build failed"; tail -n 120 build.log; exit 1; }
          cp bin/*.apk "LeaveApp-v$(grep '^version' buildozer.spec | cut -d= -f2 | tr -d ' ').apk"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            LeaveApp-*.apk
            build.log

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: leave-app-${{ github.run_number }}
          name: "رصيد الإجازات - build ${{ github.run_number }}"
          body: "تصميم عمر كريم"
          files: LeaveApp-*.apk
