name: Build Book Archive APK
run-name: "APK ← book-archive (${{ github.sha }})"

on:
  push:
    branches: [ book-archive ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache automake
          pip install --upgrade pip
          pip install buildozer==1.5.0 "cython==0.29.36"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-book-archive-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build APK
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log
          test -n "$(ls bin/*.apk 2>/dev/null)" || { echo "::error::Build failed"; tail -n 120 build.log; exit 1; }
          OUT="BookArchive-v$(grep '^version' buildozer.spec | cut -d= -f2 | tr -d ' ').apk"
          # إعادة التوقيع بالمفتاح الثابت حتى تُثبَّت التحديثات فوق النسخة القديمة
          SIGNER=$(ls -d ~/.buildozer/android/platform/android-sdk/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" sign --ks signing/debug.keystore --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android --out "$OUT" bin/*.apk
          "$SIGNER" verify --print-certs "$OUT" | tee certs.txt
          grep -qi "05f968ff2f2a58d8774532bb11d710dae53c15412254afe47d61d943ebe7d5e4" certs.txt \
            || { echo "::error::APK is not signed with the permanent key"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            BookArchive-*.apk
            build.log

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: book-archive-${{ github.run_number }}
          name: "أرشيف الكتب - build ${{ github.run_number }}"
          body: "تصميم عمر كريم"
          files: BookArchive-*.apk
