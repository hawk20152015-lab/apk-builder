# ==========================================================
#  الوكيل المركزي لبناء APK  -  Central APK Builder Agent
#  يوضع في مستودع واحد فقط، ويبني أي مستودع آخر تكتب اسمه
#  المسار:  .github/workflows/build-apk.yml  (في مستودع البناء)
#  للمستودعات الخاصة: أضف Secret باسم REPO_TOKEN
# ==========================================================
name: Central APK Builder

run-name: "APK ← ${{ inputs.repo }}"

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "اسم المستودع المراد تحويله (مثال: omar/follow-up-app)"
        required: true
        type: string
      branch:
        description: "الفرع (اتركه فارغاً للفرع الافتراضي)"
        required: false
        default: ""
        type: string
      build_type:
        description: "نوع البناء"
        required: true
        default: "debug"
        type: choice
        options: [ debug, release ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app

    steps:
      - name: Prepare name
        working-directory: .
        run: |
          NAME="${{ inputs.repo }}"; NAME="${NAME##*/}"
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.REPO_TOKEN || github.token }}
          path: app

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache
          pip install --upgrade pip
          pip install buildozer==1.5.0 "cython==0.29.36"

      # ---------- العقل المدبّر: يفحص المشروع ويجهّز buildozer.spec ----------
      - name: Analyze project and prepare buildozer.spec
        shell: python
        run: |
          import os, re, ast, sys, pathlib

          root = pathlib.Path(".")
          repo = os.environ.get("APP_NAME", "myapp")
          pkg  = re.sub(r"[^a-z0-9]", "", repo.lower()) or "myapp"

          # 1) تحديد ملف التشغيل الرئيسي
          py_files = [p for p in root.glob("*.py")]
          if not (root / "main.py").exists():
              cand = None
              for p in py_files:
                  t = p.read_text(encoding="utf-8", errors="ignore")
                  if "__main__" in t and ("App" in t or "kivy" in t):
                      cand = p; break
              if cand is None and py_files:
                  cand = py_files[0]
              if cand is None:
                  sys.exit("لا يوجد أي ملف .py في جذر المستودع")
              (root / "main.py").write_text(
                  f"import runpy\nrunpy.run_path('{cand.name}', run_name='__main__')\n",
                  encoding="utf-8")
              print(f"[agent] main.py غير موجود -> تم إنشاؤه ليشغّل {cand.name}")

          # 2) استخراج المكتبات المستخدمة من الكود
          imports = set()
          for p in root.glob("*.py"):
              try:
                  tree = ast.parse(p.read_text(encoding="utf-8", errors="ignore"))
              except SyntaxError:
                  continue
              for n in ast.walk(tree):
                  if isinstance(n, ast.Import):
                      for a in n.names: imports.add(a.name.split(".")[0])
                  elif isinstance(n, ast.ImportFrom) and n.module and n.level == 0:
                      imports.add(n.module.split(".")[0])

          MAP = {
              "kivy": ["kivy==2.3.0"],
              "kivymd": ["kivymd==1.2.0"],
              "arabic_reshaper": ["arabic-reshaper"],
              "bidi": ["python-bidi==0.4.2"],
              "PIL": ["pillow"],
              "openpyxl": ["openpyxl", "et_xmlfile"],
              "xlsxwriter": ["xlsxwriter"],
              "requests": ["requests", "urllib3", "certifi", "charset-normalizer", "idna"],
              "sqlite3": ["sqlite3"],
              "plyer": ["plyer"],
              "pyjnius": ["pyjnius"], "jnius": ["pyjnius"],
              "android": ["android"],
              "qrcode": ["qrcode"],
              "fpdf": ["fpdf"],
              "dateutil": ["python-dateutil", "six"],
              "hijri_converter": ["hijri-converter"],
              "materialyoucolor": ["materialyoucolor"],
          }
          reqs = ["python3", "kivy==2.3.0"]
          for imp in sorted(imports):
              for r in MAP.get(imp, []):
                  if r not in reqs: reqs.append(r)
          # KivyMD يحتاج pillow دائماً
          if any(r.startswith("kivymd") for r in reqs) and "pillow" not in reqs:
              reqs.append("pillow")
          # إضافة ما في requirements.txt (إن وُجد) مع تجاهل المكتبات المكتبية
          SKIP = {"pyinstaller", "pywin32", "tkinter", "buildozer", "cython"}
          rt = root / "requirements.txt"
          if rt.exists():
              for line in rt.read_text(encoding="utf-8", errors="ignore").splitlines():
                  line = line.strip()
                  if not line or line.startswith("#"): continue
                  name = re.split(r"[<>=!~ ]", line)[0].lower()
                  if name in SKIP: continue
                  if not any(r.split("==")[0].lower() == name for r in reqs):
                      reqs.append(line)
          if "tkinter" in imports:
              print("::warning::المشروع يستخدم Tkinter وهي لا تعمل على أندرويد - يجب أن تكون الواجهة Kivy/KivyMD")

          # 3) أي ملفات إضافية (خطوط، صور، قواعد بيانات)
          exts = {"py","png","jpg","jpeg","kv","atlas","ttf","otf","json","db","sqlite","txt","xlsx","wav","mp3","gif"}
          present = sorted({p.suffix[1:].lower() for p in root.rglob("*")
                            if p.is_file() and ".git" not in p.parts and p.suffix})
          inc = ",".join(sorted(exts & set(present)) or ["py"])

          icon = next((n for n in ["icon.png","logo.png"] if (root/n).exists()), None)
          splash = next((n for n in ["splash.png","presplash.png"] if (root/n).exists()), None)

          spec = root / "buildozer.spec"
          if spec.exists():
              s = spec.read_text(encoding="utf-8")
              print("[agent] تم العثور على buildozer.spec - سيتم تصحيحه فقط")
          else:
              print("[agent] لا يوجد buildozer.spec - سيتم توليده تلقائياً")
              s = f"""[app]
          title = {repo}
          package.name = {pkg}
          package.domain = org.omarkarim
          source.dir = .
          source.include_exts = {inc}
          source.exclude_dirs = .git,.github,bin,.buildozer,__pycache__
          version = 1.0
          requirements = {",".join(reqs)}
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,READ_MEDIA_IMAGES,CAMERA
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.archs = arm64-v8a, armeabi-v7a
          android.accept_sdk_license = True
          android.allow_backup = True
          p4a.branch = v2024.01.21
          {"icon.filename = %(source.dir)s/" + icon if icon else ""}
          {"presplash.filename = %(source.dir)s/" + splash if splash else ""}

          [buildozer]
          log_level = 2
          warn_on_root = 0
          """
              s = "\n".join(l.strip() for l in s.splitlines()) + "\n"

          # تصحيحات إلزامية حتى لو كان الملف موجوداً
          def force(key, val):
              global s
              pat = re.compile(rf"^\s*#?\s*{re.escape(key)}\s*=.*$", re.M)
              line = f"{key} = {val}"
              s = pat.sub(line, s, count=1) if pat.search(s) else s.replace("[app]", f"[app]\n{line}", 1)
          force("p4a.branch", "v2024.01.21")
          force("android.accept_sdk_license", "True")
          if "bidi" in imports:
              s = re.sub(r"python-bidi(==[\d.]+)?", "python-bidi==0.4.2", s)

          spec.write_text(s, encoding="utf-8")
          print("========== buildozer.spec ==========")
          print(s)
          print("requirements:", ",".join(reqs))

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            app/.buildozer
          key: buildozer-${{ env.APP_NAME }}-${{ hashFiles('app/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build APK
        run: |
          MODE="${{ inputs.build_type }}"
          yes | buildozer -v android $MODE 2>&1 | tee build.log
          ls -la bin/ || true
          test -n "$(ls bin/*.apk 2>/dev/null)" || { echo "::error::فشل البناء - راجع build.log"; tail -n 80 build.log; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ env.APP_NAME }}-${{ github.run_number }}
          path: app/bin/*.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: app/build.log

      - name: Publish to Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_NAME }}-${{ github.run_number }}
          name: "${{ env.APP_NAME }} - build ${{ github.run_number }}"
          body: "Built from ${{ inputs.repo }}"
          files: app/bin/*.apk
