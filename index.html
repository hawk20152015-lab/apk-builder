<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<title>الصندوق</title>
<style>
@font-face{font-family:Plex;src:url(/fonts/IBMPlexSansArabic-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:Plex;src:url(/fonts/IBMPlexSansArabic-SemiBold.ttf) format("truetype");font-weight:600 800;font-display:swap}
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#0b1b33; --ink2:#334155; --muted:#64748b; --faint:#94a3b8; --line:#e6eaf1;
  --navy:#0b2545; --navy2:#13396b; --navy3:#1d4e89; --gold:#d4a017; --gold2:#f5d77a;
  --add:#0d9488; --add-bg:#e6f6f4; --nath:#e11d48; --nath-bg:#fde8ed; --spend:#d97706; --spend-bg:#fdf1e2;
  --wd:#7c3aed; --wd-bg:#f1eafe; --r:18px; --nav:66px; --sh:0 1px 2px #0b1b330a,0 4px 14px #0b1b330d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Plex,"Noto Sans Arabic",Tahoma,sans-serif;font-size:15px;line-height:1.5;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.num{font-feature-settings:"tnum";direction:ltr;unicode-bidi:isolate;display:inline-block}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ====================== القفل ====================== */
#lock{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#fff;
  background:radial-gradient(130% 70% at 50% -10%,#1d4e89 0%,#0b2545 55%,#06152b 100%)}
#lock .logo{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(145deg,#f5d77a,#d4a017);box-shadow:0 16px 40px #d4a01740}
#lock h1{margin:18px 0 2px;font-size:24px;font-weight:700;letter-spacing:.2px}
#lock p{margin:0;color:#94a3b8;font-size:14px}
.dots{display:flex;gap:14px;margin:30px 0 10px;direction:ltr}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid #475569;transition:.15s}
.dots i.on{background:var(--gold2);border-color:var(--gold2);transform:scale(1.1)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#lockMsg{min-height:22px;color:#fca5a5;font-size:13px;font-weight:600}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:8px;direction:ltr}
.pad button{height:76px;border-radius:50%;border:1px solid #ffffff14;background:#ffffff0d;color:#fff;font-size:27px;font-weight:500}
.pad button:active{background:#ffffff26}
.pad .go{background:var(--gold);border:0;color:var(--navy);font-size:15px;font-weight:700}
#lock .mark{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));color:#64748b;font-size:12px;font-weight:600}

/* ====================== الإطار ====================== */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;min-height:60px}
.top h1{flex:1;margin:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{display:block;font-size:12px;color:#93a6c3;font-weight:400;margin-top:-2px}
.ib{width:42px;height:42px;border-radius:13px;border:0;background:#ffffff12;color:#fff;display:grid;place-items:center;flex:none}
.ib:active{background:#ffffff26}
.ib.light{background:#eef2f8;color:var(--navy2)}
main{padding:14px 14px calc(var(--nav) + 90px)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex;box-shadow:0 -6px 20px #0b1b330a}
nav.tabs button{flex:1;border:0;background:none;color:var(--faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600}
nav.tabs button .pill{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:.2s}
nav.tabs button.on{color:var(--navy2)}
nav.tabs button.on .pill{background:#e7eefa}
.fab{position:fixed;left:16px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));z-index:19;height:56px;padding:0 20px 0 18px;border-radius:18px;border:0;background:var(--navy2);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 12px 28px #13396b55}
.fab:active{transform:scale(.97)}
.credit{text-align:center;color:var(--faint);font-size:12px;font-weight:600;margin:22px 0 4px}

/* ====================== بطاقات ====================== */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.card.tap:active{transform:scale(.99)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
.sec h2{margin:0;font-size:16px;font-weight:700}
.sec .lnk{border:0;background:none;color:var(--navy3);font-weight:600;font-size:13px;padding:4px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.t1{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none;color:var(--navy2);background:#e7eefa}
.amt{font-weight:700;font-size:16px}
.pos{color:var(--add)}.neg{color:var(--nath)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.k-add{background:var(--add-bg);color:#0f766e}.k-nathriya{background:var(--nath-bg);color:#be123c}
.k-spend{background:var(--spend-bg);color:#b45309}.k-withdraw{background:var(--wd-bg);color:#6d28d9}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.empty svg{width:52px;height:52px;stroke:var(--faint);stroke-width:1.4;fill:none;display:block;margin:0 auto 10px}
.list .card{padding:13px 14px;margin-bottom:8px}

/* البطل */
.hero{border-radius:24px;padding:20px 18px 16px;color:#fff;position:relative;overflow:hidden;margin-bottom:12px;
  background:linear-gradient(140deg,#0b2545 0%,#13396b 60%,#1d4e89 100%);box-shadow:0 14px 34px #0b254540}
.hero:after{content:"";position:absolute;left:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#d4a01733,transparent 65%)}
.hero .lbl{color:#a9bbd6;font-size:13px;font-weight:600}
.hero .big{font-size:34px;font-weight:700;line-height:1.25;margin:2px 0 14px;letter-spacing:.3px}
.hero .big small{font-size:14px;color:#a9bbd6;font-weight:500;margin-right:6px}
.hero .sub{display:flex;gap:10px;position:relative;z-index:1}
.hero .sub>div{flex:1;background:#ffffff12;border:1px solid #ffffff14;border-radius:16px;padding:10px 12px}
.hero .sub b{display:block;font-size:17px}
.hero .sub span{font-size:12px;color:#a9bbd6}
.nathBox{display:flex;align-items:center;gap:10px}
.btn-gold{border:0;border-radius:12px;background:var(--gold);color:var(--navy);font-weight:700;font-size:13px;padding:8px 12px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.quick button{border:0;background:#fff;border-radius:16px;box-shadow:var(--sh);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2)}
.quick button .q{width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
.quick button:active{transform:scale(.97)}

/* إحصاء */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:12px 14px;position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;right:0;top:12px;bottom:12px;width:4px;border-radius:4px 0 0 4px;background:var(--c)}
.stat span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.stat b{display:block;font-size:19px;margin-top:2px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.grid4>div{background:#f6f8fb;border-radius:12px;padding:8px 10px}
.grid4 span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.grid4 b{font-size:15px}
.netline{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted);font-weight:600}
.netline b{font-size:17px;color:var(--ink)}

/* الرسم */
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--ink2);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;border-radius:12px;padding:8px 10px;font-size:12px;min-width:130px;box-shadow:0 8px 20px #0003;z-index:3}
.tip b{display:block;margin-bottom:4px;font-size:13px}
.tip div{display:flex;justify-content:space-between;gap:10px}

/* الحقول */
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.in{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;background:#f8fafc;font-size:15.5px;outline:none;appearance:none}
.in:focus{border-color:var(--navy3);background:#fff;box-shadow:0 0 0 4px #1d4e8914}
.in.big{font-size:24px;font-weight:700;text-align:center;letter-spacing:.5px}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:18px 52%,24px 52%;background-size:6px 6px;background-repeat:no-repeat;padding-left:36px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kinds button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 4px;font-weight:700;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.kinds button.on[data-k=add]{border-color:var(--add);background:var(--add-bg);color:#0f766e}
.kinds button.on[data-k=nathriya]{border-color:var(--nath);background:var(--nath-bg);color:#be123c}
.kinds button.on[data-k=spend]{border-color:var(--spend);background:var(--spend-bg);color:#b45309}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 12px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.chips button.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
.hint{font-size:12.5px;color:var(--muted);background:#f6f8fb;border-radius:12px;padding:10px 12px;margin-bottom:12px;line-height:1.7}
.sum{display:flex;justify-content:space-between;align-items:center;background:#f6f8fb;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;color:var(--muted);font-weight:600}
.sum b{font-size:18px;color:var(--ink)}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;color:#fff;background:var(--navy2);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{filter:brightness(.92)}
.btn.block{width:100%}
.btn.ghost{background:#eef2f8;color:var(--navy2)}
.btn.red{background:var(--nath)}.btn.teal{background:var(--add)}.btn.amber{background:var(--spend)}.btn.violet{background:var(--wd)}
.btn.sm{padding:9px 12px;font-size:13.5px;border-radius:12px}
.btn.wa{background:#16a34a}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts.four{grid-template-columns:repeat(4,1fr)}
.act{border:0;background:#fff;border-radius:16px;box-shadow:var(--sh);padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2)}
.act .q{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.searchbar{position:relative;margin-bottom:12px}
.searchbar .in{padding-right:42px;background:#fff;border-color:#e3e8f0}
.searchbar svg{position:absolute;right:13px;top:50%;transform:translateY(-50%);stroke:var(--faint)}

/* نافذة سفلية */
#sheetBg{position:fixed;inset:0;background:#06152b8c;z-index:40;opacity:0;pointer-events:none;transition:.2s}
#sheetBg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:#fff;border-radius:26px 26px 0 0;z-index:41;padding:8px 18px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(105%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s}
#sheet.on{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
#sheet .grab{width:44px;height:5px;border-radius:9px;background:#d5dce6;margin:4px auto 14px}
#sheet h3{margin:0 0 4px;font-size:19px}
#sheet .shsub{color:var(--muted);font-size:13px;margin:0 0 16px}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 96px);transform:translateX(-50%) translateY(16px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;transition:.2s;z-index:50;max-width:90%;text-align:center;pointer-events:none;box-shadow:0 10px 24px #0004}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast.bad{background:#9f1239}
#busy{position:fixed;inset:0;z-index:55;background:#ffffffb3;display:grid;place-items:center}
#busy .sp{width:46px;height:46px;border-radius:50%;border:4px solid #dbe3ef;border-top-color:var(--navy2);animation:spin .8s linear infinite}
#busy p{margin:12px 0 0;font-weight:600;color:var(--navy2);text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}

/* تحديد */
.ck{width:24px;height:24px;border-radius:8px;border:2px solid #cbd5e1;flex:none;display:grid;place-items:center;transition:.15s}
.sel .ck{background:var(--navy2);border-color:var(--navy2)}
.sel{outline:2px solid var(--navy3);outline-offset:-2px}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 12px + env(safe-area-inset-bottom));z-index:21;background:var(--navy);color:#fff;border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 14px 30px #0b254560}
.selbar .grow{font-weight:700}
.selbar button{border:0;border-radius:12px;padding:9px 12px;font-weight:700;font-size:13px}

/* سجل */
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.tx .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.tx .x{border:0;background:none;color:var(--faint);padding:6px;margin-right:-6px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{color:var(--muted);font-weight:600;font-size:12px;text-align:right;padding:8px 6px;border-bottom:1.5px solid var(--line)}
table.t td{padding:10px 6px;border-bottom:1px solid var(--line);font-weight:600}
table.t td.n,table.t th.n{text-align:left}
table.t tr:last-child td{border:0}
table.t tfoot td{border-top:1.5px solid var(--ink2);font-weight:700}
.info{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.info:last-child{border:0}
.info .k{color:var(--muted);font-size:13px;width:90px;flex:none}
.info .v{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.copy{border:0;background:#eef2f8;color:var(--navy2);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700}
.mhead{text-align:center;padding:6px 0 4px}
.mhead .av{width:64px;height:64px;border-radius:22px;font-size:26px;margin:0 auto 8px}
.mhead .bal{font-size:32px;font-weight:700;margin:4px 0 2px}
.badge{display:inline-flex;align-items:center;gap:4px;background:#fff6d6;color:#8a6406;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700}
.menu .mi{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);font-weight:600;width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:right}
.menu .mi:last-child{border-bottom:0}
.menu .mi .q{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.menu .mi small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.result{text-align:center;padding:6px 0 4px}
.result .ok{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--add-bg);color:var(--add)}
.path{unicode-bidi:plaintext;font-size:12.5px;color:var(--muted);background:#f6f8fb;border-radius:10px;padding:8px 10px;margin:8px 0 16px;word-break:break-all;text-align:center}
</style>
</head>
<body>

<div id="lock">
  <div class="logo"><svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#0b2545" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="13" cy="12" r="3.2"/><path d="M13 8.8v1M13 14.2v1M9.8 12h1M15.2 12h1M6.5 9v6"/></svg></div>
  <h1>الصندوق</h1>
  <p>أدخل الرمز السري</p>
  <div class="dots" id="dots"></div>
  <div id="lockMsg"></div>
  <div class="pad" id="pad"></div>
  <div class="mark" id="lockMark">تطوير عمر كريم</div>
</div>

<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div id="sheetBg"></div>
<div id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="toast"></div>
<div id="busy" class="hidden"><div><div class="sp" style="margin:auto"></div><p id="busyMsg">جاري التنفيذ...</p></div></div>
<input type="file" id="filePick" class="hidden">

<script>
"use strict";
// ================================================================ أساسيات
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { n = Number(n) || 0; const s = Math.round(Math.abs(n)).toLocaleString('en-US'); return (n < 0 ? '-' : '') + s; };
const money = n => `<bdi class="num">${fmt(n)}</bdi>`;
const MONTHS = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
const MSHORT = ['ك الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','ت الأول','ت الثاني','ك الأول'];
const K = {
  add:{label:'إضافة', color:'#0d9488', bg:'var(--add-bg)', ink:'#0f766e', sign:'+'},
  nathriya:{label:'خصم للنثرية', color:'#e11d48', bg:'var(--nath-bg)', ink:'#be123c', sign:'−'},
  spend:{label:'صرف', color:'#d97706', bg:'var(--spend-bg)', ink:'#b45309', sign:'−'},
  withdraw:{label:'سحب من النثرية', color:'#7c3aed', bg:'var(--wd-bg)', ink:'#6d28d9', sign:'−'},
};
const P = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/>',

async function api(path, data){

  try{ const r = await fetch(path, opt); return await r.json(); }
  catch(e){ return {ok:false, error:'تعذّر الاتصال'}; }
}
function toast(msg, bad){ const t = $('#toast'); t.textContent = msg; t.className = 'on' + (bad ? ' bad' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = bad ? 'bad' : '', 2600); }
function busy(on, msg){ $('#busy').classList.toggle('hidden', !on); if(msg) $('#busyMsg').textContent = msg; }
async function act(path, data, after){
  const r = await api(path, data ?? {});
  if(!r.ok){ toast(r.error || 'حدث خطأ', true); return null; }

function bindAmount(id, onChange){
  const el = $('#'+id);
  const toLatin = s => s.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,٬\s]/g, '');
  el.addEventListener('input', () => { const raw = toLatin(el.value).replace(/[^\d.]/g, '');
    const [a, b] = raw.split('.'); el.value = (a ? Number(a).toLocaleString('en-US') : '') + (b !== undefined ? '.' + b.slice(0,2) : '');
    onChange && onChange(Number(raw) || 0); });
  return () => Number(toLatin(el.value)) || 0;
}
function copyText(t, label){
  const done = () => toast(`تم نسخ ${label}`);
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t).then(done, fallback); } else fallback();
  function fallback(){ const a = document.createElement('textarea'); a.value = t; a.style.position='fixed'; a.style.opacity='0';
    document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('تعذّر النسخ', true); } a.remove(); }
}

  const keys = ['1','2','3','4','5','6','7','8','9','⌫','0','دخول'];

async function tryPin(auto){
  if(!pin || pinBusy) return; pinBusy = true;
  const r = await api('/api/login', {pin}); pinBusy = false;
  if(r.ok){ pin = ''; tries = 0; drawDots(); $('#lockMsg').textContent = ''; $('#lock').classList.add('hidden'); if(!booted){ booted = true; go('home'); } return; }
  if(auto) return;

  if(tries >= 5){ $('#lockMsg').textContent = 'محاولات كثيرة — انتظر 30 ثانية'; $('#pad').style.pointerEvents = 'none';
    setTimeout(() => { tries = 0; $('#pad').style.pointerEvents = ''; $('#lockMsg').textContent = ''; }, 30000); return; }
  $('#lockMsg').textContent = 'رمز غير صحيح — المتبقي ' + (5 - tries);

function drawChart(rows){
  const el = $('#chart'); if(!el) return;
  const keys = ['add','nathriya','spend','withdraw'];
  const max = Math.max(1, ...rows.flatMap(r => keys.map(k => r[k] || 0)));
  const W = 340, H = 170, L = 6, B = 26, T = 8, gw = (W - L) / rows.length, bw = Math.min(9, (gw - 12) / 4), gap = 2;
  const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; };
  const top = nice(max), y = v => T + (H - B - T) * (1 - v / top);
  let g = '';
  for(let i = 0; i <= 2; i++){ const v = top * i / 2, yy = y(v);
    g += `<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" stroke="#eef1f6" stroke-width="1"/>`;
    g += `<text x="${W}" y="${yy - 3}" font-size="9" fill="#94a3b8" text-anchor="end" direction="ltr">${v >= 1e6 ? (v/1e6).toLocaleString('en-US') + 'M' : v >= 1000 ? (v/1000).toLocaleString('en-US') + 'k' : v}</text>`; }
  rows.forEach((r, i) => {
    const gx = W - (i + 1) * gw + (gw - (bw * 4 + gap * 3)) / 2;   // من اليمين لليسار
    keys.forEach((k, j) => { const v = r[k] || 0; if(!v) return; const x = gx + (3 - j) * (bw + gap), yy = y(v), h = (H - B) - yy;
      g += `<path d="M${x},${H - B} v${-Math.max(h - 3, 0)} q0,-3 3,-3 h${bw - 6} q3,0 3,3 v${Math.max(h - 3, 0)} z" fill="${K[k].color}"/>`; });
    const mo = +r.month.slice(5) - 1;
    g += `<text x="${W - (i + .5) * gw}" y="${H - 8}" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="600">${MSHORT[mo]}</text>`;
    g += `<rect class="hit" data-i="${i}" x="${W - (i + 1) * gw}" y="0" width="${gw}" height="${H}" fill="transparent"/>`;
  });
  g += `<line x1="0" x2="${W}" y1="${H - B}" y2="${H - B}" stroke="#cbd5e1" stroke-width="1"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="الحركة الشهرية">${g}</svg>
    <div class="legend">${keys.map(k => `<span><i class="dot" style="background:${K[k].color}"></i>${K[k].label}</span>`).join('')}</div>
    <div class="tip hidden" id="tip"></div>`;
  const tip = $('#tip');
  el.querySelectorAll('.hit').forEach(h => h.addEventListener('click', ev => {
    const r = rows[+h.dataset.i], mo = +r.month.slice(5) - 1;
    el.querySelectorAll('.hit').forEach(x => x.setAttribute('fill', 'transparent')); h.setAttribute('fill', '#0b25450a');
    tip.innerHTML = `<b>${MONTHS[mo]} ${r.month.slice(0,4)}</b>` + keys.map(k => `<div><span>${K[k].label}</span><span class="num">${fmt(r[k])}</span></div>`).join('');
    tip.classList.remove('hidden');
    const box = el.getBoundingClientRect(), hb = h.getBoundingClientRect();
    let left = hb.left - box.left + hb.width / 2 - 75; left = Math.max(0, Math.min(left, box.width - 160));
    tip.style.left = left + 'px'; tip.style.top = '4px';
    ev.stopPropagation();
  }));
  el.addEventListener('click', () => { tip.classList.add('hidden'); el.querySelectorAll('.hit').forEach(x => x.setAttribute('fill', 'transparent')); });
}

    api('/api/divisions')]);
  if(!r.ok) return toast(r.error, true);
  const kinds = [['', 'الكل'], ['add', 'إضافة'], ['nathriya', 'نثرية'], ['spend', 'صرف'], ['withdraw', 'سحب']];
  const t = r.totals;
  page('سجل الحركات', `${r.rows.length} حركة`, `
    <div class="chips" style="margin:0 0 10px">${kinds.map(([k, l]) => `<button class="${p.kind === k ? 'on' : ''}" onclick="setLedger({kind:'${k}'})">${l}</button>`).join('')}</div>
    <div class="card" style="padding:12px">
      <div class="two"><label class="f" style="margin:0"><span>من</span><input class="in" type="date" id="lF" value="${p.from}"></label>
      <label class="f" style="margin:0"><span>إلى</span><input class="in" type="date" id="lT" value="${p.to}"></label></div>
      <label class="f" style="margin:10px 0 0"><span>الشعبة</span><select class="in" id="lD"><option value="">كل الشعب</option>
        ${dv.divisions.map(d => `<option value="${d.id}" ${String(d.id) === String(p.division) ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select></label>
      <div class="searchbar" style="margin:10px 0 0">${ic('search')}<input class="in" id="lQ" placeholder="اسم أو ملاحظة..." value="${esc(p.q || '')}"></div>
    </div>
    <div class="stats">
      <div class="stat" style="--c:var(--add)"><span>إضافة</span><b>${money(t.add)}</b></div>
      <div class="stat" style="--c:var(--nath)"><span>خصم للنثرية</span><b>${money(t.nathriya)}</b></div>
      <div class="stat" style="--c:var(--spend)"><span>صرف</span><b>${money(t.spend)}</b></div>
      <div class="stat" style="--c:var(--wd)"><span>سحب من النثرية</span><b>${money(t.withdraw)}</b></div>
    </div>
    <div class="card" style="padding:4px 14px">${r.rows.length ? r.rows.map(x => txRow(x)).join('') : empty('list', 'لا توجد حركات مطابقة')}</div>`);
  $('#lF').onchange = () => setLedger({from:$('#lF').value}); $('#lT').onchange = () => setLedger({to:$('#lT').value});
  $('#lD').onchange = () => setLedger({division:$('#lD').value}); $('#lQ').oninput = debounce(() => setLedger({q:$('#lQ').value}, true), 400);
};
function setLedger(ch, keepFocus){ Object.assign(cur().params, ch); render().then(() => { if(keepFocus){ const e = $('#lQ'); e.focus(); e.setSelectionRange(e.value.length, e.value.length); } }); }

// ================================================================ التقارير
const pad2 = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
function presets(){
  const t = new Date(INFO.today + 'T00:00'), y = t.getFullYear(), m = t.getMonth();
  return {month:[iso(new Date(y, m, 1)), iso(new Date(y, m + 1, 0))], last:[iso(new Date(y, m - 1, 1)), iso(new Date(y, m, 0))],
          year:[`${y}-01-01`, `${y}-12-31`], all:['2000-01-01', `${y}-12-31`]};
}
VIEWS.reports = async p => {
  const pr = presets(); p.pre = p.pre || 'month';
  if(p.pre !== 'custom'){ [p.from, p.to] = pr[p.pre]; }
  const r = await api(`/api/report?from=${p.from}&to=${p.to}`);
  const names = {month:'هذا الشهر', last:'الشهر الماضي', year:'هذه السنة', all:'كل المدة', custom:'مخصّص'};
  const rows = r.ok ? r.rows.filter(x => x.n || !x.name.includes('المنقولون')) : [];
  const t = r.ok ? r.totals : {};
  page('التقارير', names[p.pre], `
    <div class="chips" style="margin:0 0 10px">${Object.keys(names).map(k => `<button class="${p.pre === k ? 'on' : ''}" onclick="setRep('${k}')">${names[k]}</button>`).join('')}</div>
    <div class="card" style="padding:12px"><div class="two">
      <label class="f" style="margin:0"><span>من</span><input class="in" type="date" id="rF" value="${p.from}"></label>
      <label class="f" style="margin:0"><span>إلى</span><input class="in" type="date" id="rT" value="${p.to}"></label></div></div>
    ${r.ok ? `
    <div class="stats">
      <div class="stat" style="--c:var(--add)"><span>الإضافات</span><b>${money(t.added)}</b></div>
      <div class="stat" style="--c:var(--nath)"><span>خصم للنثرية</span><b>${money(t.nathriya)}</b></div>
      <div class="stat" style="--c:var(--spend)"><span>المصروف</span><b>${money(t.spent)}</b></div>
      <div class="stat" style="--c:var(--wd)"><span>سحب من النثرية</span><b>${money(t.withdrawn)}</b></div>
    </div>
    <div class="card"><div class="sec" style="margin:0 0 8px"><h2>حسب الشعبة</h2><span class="t2">${t.n} حركة</span></div>
      <div style="overflow-x:auto"><table class="t"><thead><tr><th>الشعبة</th><th class="n">إضافة</th><th class="n">نثرية</th><th class="n">صرف</th></tr></thead>
      <tbody>${rows.map(x => `<tr><td>${esc(x.name)}</td><td class="n" style="color:var(--add)">${money(x.added)}</td><td class="n" style="color:var(--nath)">${money(x.nathriya)}</td><td class="n" style="color:var(--spend)">${money(x.spent)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>المجموع</td><td class="n">${money(t.added)}</td><td class="n">${money(t.nathriya)}</td><td class="n">${money(t.spent)}</td></tr></tfoot></table></div></div>
    <div class="two"><button class="btn red" onclick="exportFile({what:'report_pdf', from:'${p.from}', to:'${p.to}'})">${ic('file')}تقرير PDF</button>
      <button class="btn teal" onclick="exportFile({what:'all_xlsx'})">${ic('sheet')}كل البيانات إكسل</button></div>` : `<div class="card">${empty('cal', r.error)}</div>`}`);
  $('#rF').onchange = () => { Object.assign(cur().params, {pre:'custom', from:$('#rF').value}); render(); };
  $('#rT').onchange = () => { Object.assign(cur().params, {pre:'custom', to:$('#rT').value}); render(); };
};
function setRep(k){ cur().params.pre = k; render(); }

// ================================================================ المزيد
VIEWS.more = async () => {
  page('المزيد', 'الإعدادات والبيانات', `
    <div class="card menu" style="padding:4px 14px">
      ${menuItem('shield', '#fff6d6', '#8a6406', 'نسخة احتياطية', 'حفظ كل البيانات في ملف واحد ومشاركته', 'backupNow()')}
      ${menuItem('restore', '#e7eefa', 'var(--navy2)', 'استعادة نسخة', 'من ملف نسخة احتياطية (zip)', 'restoreAsk()')}
    </div>
    <div class="card menu" style="padding:4px 14px">
      ${menuItem('inn', '#e6f6f4', '#0f766e', 'استيراد من إكسل', 'أفراد لكل الشعب — الشعبة تُنشأ تلقائياً', "pickFile('excel')")}
      ${menuItem('sheet', '#e6f6f4', '#0f766e', 'تصدير كل البيانات', 'ملخص الشعب + كل الأفراد + سجل الحركات', "exportFile({what:'all_xlsx'})")}
      ${menuItem('file', '#f1f5f9', 'var(--ink2)', 'قالب الاستيراد', 'ملف إكسل جاهز للتعبئة', "exportFile({what:'template'})")}
    </div>
    <div class="card menu" style="padding:4px 14px">
      ${menuItem('key', '#f1eafe', '#6d28d9', 'تغيير الرمز السري', 'الرمز الافتراضي 1234', 'pinSheet()')}
      ${menuItem('lock', '#fde8ed', '#be123c', 'قفل التطبيق', 'العودة لشاشة الرمز', 'lockNow()')}
    </div>
    <div class="card" style="text-align:center;padding:22px 16px">
      <div class="av" style="width:58px;height:58px;border-radius:18px;margin:0 auto 10px;background:linear-gradient(145deg,#f5d77a,#d4a017);color:var(--navy)">${ic('safe','style="width:28px;height:28px"')}</div>
      <div style="font-weight:700;font-size:17px">الصندوق</div><div class="t2">الإصدار ${esc(INFO.version)}</div>
      <div style="margin-top:8px;font-weight:700;color:var(--navy2)">${esc(INFO.dev)}</div><div class="t2">جميع الحقوق محفوظة © 2026</div>
    </div>`);
};
function pinSheet(){
  openSheet(`<h3>تغيير الرمز السري</h3><p class="shsub">4 أرقام على الأقل</p>
    <label class="f"><span>الرمز الحالي</span><input class="in" id="p0" type="password" inputmode="numeric"></label>
    <label class="f"><span>الرمز الجديد</span><input class="in" id="p1" type="password" inputmode="numeric"></label>
    <label class="f"><span>تأكيد الرمز الجديد</span><input class="in" id="p2" type="password" inputmode="numeric"></label>
    <button class="btn block" id="pS">${ic('check')}حفظ الرمز</button>`);
  $('#pS').onclick = () => act('/api/pin', {old:$('#p0').value, new:$('#p1').value, confirm:$('#p2').value}, closeSheet);
}
function restoreAsk(){
  confirmBox('استعادة نسخة احتياطية', 'سيتم استبدال كل البيانات الحالية بمحتوى النسخة التي تختارها. يُحفظ نسخة من البيانات الحالية تلقائياً قبل الاستبدال.', 'اختيار الملف', () => pickFile('restore'), false);
}

// ================================================================ الملفات
async function exportFile(spec){
  closeSheet(); busy(true, 'جاري إنشاء الملف...');
  const r = await api('/api/export', spec); busy(false);
  if(!r.ok) return toast(r.error, true);
  fileResult(r);
}
async function backupNow(){
  closeSheet(); busy(true, 'جاري إنشاء النسخة الاحتياطية...');
  const r = await api('/api/backup', {}); busy(false);
  if(!r.ok) return toast(r.error, true);
  fileResult(r, 'أرسلها إلى واتساب أو Drive لتبقى محفوظة خارج الهاتف.');
}
function fileResult(r, extra){
  openSheet(`<div class="result"><div class="ok">${ic('check','style="width:30px;height:30px"')}</div><h3>تم حفظ الملف</h3>
    <div class="path">${esc(r.where)}</div>${extra ? `<p class="shsub" style="margin-top:-6px">${esc(extra)}</p>` : ''}</div>
    ${r.android ? `<div class="two"><button class="btn ghost" onclick="api('/api/open/${r.token}', {})">${ic('open')}فتح</button>
      <button class="btn" onclick="api('/api/share/${r.token}', {})">${ic('share')}مشاركة</button></div>`
      : `<a class="btn block" href="${r.url}" download style="text-decoration:none">${ic('inn')}تنزيل</a>`}`);
}
let pickPoll = null;
async function pickFile(purpose, division_id){
  closeSheet();
  if(!INFO.android){            // على الحاسبة: منتقي المتصفح
    const inp = $('#filePick'); inp.value = ''; inp.accept = purpose === 'restore' ? '.zip,.db' : '.xlsx';
    inp.onchange = async () => { if(!inp.files[0]) return; const fd = new FormData(); fd.append('file', inp.files[0]); fd.append('purpose', purpose);
      if(division_id) fd.append('division_id', division_id); busy(true, 'جاري المعالجة...');
      const r = await (await fetch('/api/upload', {method:'POST', body:fd})).json(); busy(false); afterPick(r); };
    inp.click(); return;
  }
  const s = await api('/api/pick/start', {purpose, division_id}); if(!s.ok) return toast(s.error, true);
  clearInterval(pickPoll);
  pickPoll = setInterval(async () => {
    const r = await api('/api/pick/status');
    if(r.status === 'waiting') return;
    clearInterval(pickPoll); busy(false);
    if(r.status === 'cancel') return;
    if(r.status === 'error') return toast('تعذّرت قراءة الملف: ' + (r.error || ''), true);
    if(r.status === 'done') afterPick(r.result || {ok:false, error:'لا توجد نتيجة'});
  }, 700);
}
function afterPick(r){ if(!r.ok) return toast(r.error, true); toast(r.msg); render(); }

// ================================================================ البدء
(async function init(){
  buildLock(); buildTabs();
  const r = await api('/api/info'); if(r.ok){ INFO = r; $('#lockMark').textContent = r.dev + ' · 2026'; }
  history.pushState(null, '');
})();
</script>
</body>
</html>
